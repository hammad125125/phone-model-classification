[project]
name = "phone-model-classification"
version = "1.0.0"
description = "Mobile Phone Model Classification Using Deep Learning"
readme = "README.md"
requires-python = ">=3.10, <3.12"
dependencies = [
    "Flask>=3.0.0",
    "Flask-Cors>=4.0.0",
    "Werkzeug>=3.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
    "gunicorn>=21.2.0; sys_platform != 'win32'"
]

[tool.uv]
managed = true
